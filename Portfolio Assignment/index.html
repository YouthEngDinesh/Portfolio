<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私のプロフィール</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <!-- header -->
    <header class="text-center text-white bg-dark py-4 rounded-3 mb-4">
        <div class="container">
            <h1 class="mb-2">私のプロフィール</h1>
            <p class="mb-0">Gupta Dinesh</p>
        </div>
    </header>

    <main class="container mb-4">
        <div class="profile-card p-4 rounded shadow-sm">
            <div class="row align-items-center mb-4">
                <div class="col-md-4 text-center mb-3 mb-md-0">
                    <img src="dinesh_profile.jpg" alt="Profile image" class="img-fluid rounded-circle profile-image">
                </div>
                <div class="col-md-8">
                    <h2 class="h4 mb-3">プロフィール</h2>
                    <!-- /* table for profile details */  -->

                    <table class="table table-bordered mb-0 profile-table">
                        <tbody>
                            <tr>
                                <th scope="row">年齢</th>
                                <td>32</td>
                            </tr>
                            <tr>
                                <th scope="row">職業</th>
                                <td>Software Developer</td>
                            </tr>
                            <tr>
                                <th scope="row">地域</th>
                                <td>Niihama City</td>
                            </tr>
                            <tr>
                                <th scope="row">経験</th>
                                <td>3 years in Japan</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <h2 class="h5">趣味</h2>
                    <ul class="list-unstyled ps-3">
                        <li>• 山登り (Mountain Hiking)</li>
                        <li>• 自然旅行 (Travelling to Nature)</li>
                    </ul>
                </div>
                <div class="col-md-6">
                    <h2 class="h5">言語</h2>
                    <ul class="list-unstyled ps-3">
                        <li>• 日本語 (Japanese)</li>
                        <li>• English</li>
                    </ul>
                </div>
            </div>

            <nav class="text-center">
                <a href="./page2.html" class="btn btn-dark">次へ</a>
            </nav>
        </div>
    </main>

    <footer class="text-center text-muted">
        <p class="mb-0">&copy; 2026 My Portfolio</p>
    </footer>
</body>
</html>
